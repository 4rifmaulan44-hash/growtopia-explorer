<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1420">
  <title>Growtopia Sandbox</title>
  <style>
    :root {
      --hud-scale: 1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a1420;
      font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #game-root {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* ─── Loading Screen ─── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0e1e2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 9999;
    }
    #loading-screen.hidden { display: none; }
    .load-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #f9d342;
      text-shadow: 2px 2px 0 #000;
    }
    .load-bar-bg {
      width: 240px;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #5ca8d6;
      border-radius: 3px;
      overflow: hidden;
    }
    #load-bar-fill {
      width: 0%;
      height: 100%;
      background: #48c9b0;
      transition: width 0.2s ease;
    }
    #load-status {
      font-size: 12px;
      color: #cbe7f7;
      text-shadow: 1px 1px 0 #000;
    }

    /* ─── Real GT Top HUD ─── */
    #hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 6px 8px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 25;
    }

    .hud-top-left {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      pointer-events: auto;
      transform-origin: top left;
      transform: scale(var(--hud-scale));
    }

    #hud-profile-card {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 46, 72, 0.74);
      border: 2px solid rgba(126, 200, 242, 0.85);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.55);
      border-radius: 5px;
      padding: 3px 7px 3px 4px;
      cursor: pointer;
    }
    #hud-profile-card:active { transform: scale(0.97); }

    #hud-avatar-box {
      width: 34px;
      height: 34px;
      background: rgba(8, 22, 36, 0.78);
      border: 1.5px solid #5ca8d6;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    #hud-avatar-mini {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }

    .hud-profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 82px;
    }
    .hud-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #hud-player-name {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      line-height: 1.1;
    }
    #hud-world-tag {
      font-size: 9px;
      font-weight: 900;
      color: #7ee8fa;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(126, 200, 242, 0.5);
      border-radius: 3px;
      padding: 0 4px;
      text-shadow: 1px 1px 0 #000;
    }

    .hud-gems-row {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(6, 18, 30, 0.76);
      border: 1.5px solid #4fa3d1;
      border-radius: 3px;
      padding: 1px 3px 1px 4px;
    }
    .pixel-gem-canvas {
      width: 15px;
      height: 15px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }
    #hud-gems-val {
      font-size: 12px;
      font-weight: 900;
      color: #ffe666;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
      min-width: 34px;
    }
    #btn-gems-plus {
      width: 16px;
      height: 16px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }
    #btn-gems-plus img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    /* Top-Right: Fullscreen, Zoom -/+ & Trimmed Store/Menu Buttons */
    .hud-top-right {
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
      transform-origin: top right;
      transform: scale(var(--hud-scale));
    }

    .hud-zoom-btn {
      width: 34px;
      height: 34px;
      background: rgba(20, 56, 86, 0.72);
      border: 2px solid rgba(126, 200, 242, 0.85);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 1px 1px 0 #000;
    }
    .hud-zoom-btn:active { transform: scale(0.92); }
    .hud-zoom-btn.active {
      border-color: #ffe666;
      color: #ffe666;
    }

    .hud-icon-btn {
      width: 36px;
      height: 36px;
      background: rgba(20, 56, 86, 0.65);
      border: 2px solid rgba(126, 200, 242, 0.85);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s;
    }
    .hud-icon-btn:active { transform: scale(0.92); }
    .hud-icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    /* ─── Real GT 3-State Top-Center Chat Console ─── */
    #gt-chat-box {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scale(var(--hud-scale));
      transform-origin: top center;
      width: min(390px, 44vw);
      z-index: 22;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #chat-log {
      width: 100%;
      max-height: 58px;
      overflow-y: hidden;
      background: rgba(12, 34, 54, 0.52);
      border: 2px solid rgba(126, 200, 242, 0.58);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: auto;
      transition: max-height 0.16s ease, padding 0.16s ease, opacity 0.16s ease, background 0.16s ease;
    }
    #gt-chat-box[data-state="collapsed"] #chat-log {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    #gt-chat-box[data-state="expanded"] #chat-log {
      max-height: 195px;
      overflow-y: auto;
      background: rgba(12, 34, 54, 0.86);
      border-color: rgba(126, 200, 242, 0.88);
    }

    .chat-line {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
      word-break: break-word;
    }
    .chat-line.sys { color: #ffe666; }
    .chat-line .chat-sender { color: #90e0ef; font-weight: 900; }

    #chat-handle-btn {
      width: 82px;
      height: 18px;
      background: rgba(20, 56, 86, 0.76);
      border: 1.5px solid rgba(126, 200, 242, 0.75);
      border-top: none;
      border-radius: 0 0 6px 6px;
      cursor: ns-resize;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #chat-handle-btn img {
      width: 48px;
      height: 11px;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #chat-input-wrap {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: min(410px, 88vw);
      background: rgba(16, 46, 72, 0.94);
      border: 2px solid #7ec8f2;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      border-radius: 5px;
      padding: 5px;
      display: flex;
      gap: 6px;
      z-index: 65;
    }
    #chat-input-wrap.hidden { display: none; }
    #chat-input {
      flex: 1;
      background: rgba(6, 18, 30, 0.8);
      border: 1.5px solid #5ca8d6;
      border-radius: 3px;
      color: #fff;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }

    /* ─── Transparent Touch Controls ─── */
    #touch-left {
      position: absolute;
      left: 14px;
      bottom: calc(74px * var(--hud-scale) + 8px);
      display: flex;
      gap: 10px;
      z-index: 25;
      pointer-events: auto;
      transform-origin: bottom left;
      transform: scale(var(--hud-scale));
      transition: bottom 0.16s ease;
    }
    #touch-right {
      position: absolute;
      right: 14px;
      bottom: calc(74px * var(--hud-scale) + 8px);
      display: flex;
      gap: 10px;
      z-index: 25;
      pointer-events: auto;
      transform-origin: bottom right;
      transform: scale(var(--hud-scale));
      transition: bottom 0.16s ease;
    }
    #game-root.inv-collapsed #touch-left,
    #game-root.inv-collapsed #touch-right {
      bottom: 16px;
    }

    .gt-ctrl-btn {
      width: 56px;
      height: 56px;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.68;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.06s, opacity 0.06s;
    }
    .gt-ctrl-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .gt-ctrl-btn.active, .gt-ctrl-btn:active {
      opacity: 0.98;
      transform: scale(0.92);
    }

    /* ─── Real GT 3-State Sliding Bottom Inventory Drawer ─── */
    #inv-drawer {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) scale(var(--hud-scale));
      transform-origin: bottom center;
      width: min(630px, 96vw);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #inv-handle-btn {
      width: 110px;
      height: 22px;
      background: rgba(24, 68, 102, 0.88);
      border: 2px solid #7ec8f2;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      cursor: ns-resize;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #inv-handle-btn img {
      width: 68px;
      height: 14px;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }

    #inv-panel {
      width: 100%;
      background: rgba(22, 62, 94, 0.86);
      border: 2px solid #7ec8f2;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      box-shadow: inset 0 0 0 2px rgba(9, 25, 40, 0.8);
      padding: 6px 7px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: max-height 0.16s ease, padding 0.16s ease, opacity 0.16s ease;
    }
    #inv-drawer[data-state="collapsed"] #inv-panel {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #inv-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(10, 30, 48, 0.86);
      border: 2px solid #4fa3d1;
      border-radius: 5px;
      padding: 6px 8px;
    }
    #inv-drawer:not([data-state="expanded"]) #inv-action-bar,
    #inv-drawer:not([data-state="expanded"]) #inv-pos-bar {
      display: none;
    }

    /* Compact Live Wearable Position Adjuster (Uses repo AvatarPositioning) */
    #inv-pos-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(8, 24, 40, 0.92);
      border: 2px solid #38bdf8;
      border-radius: 5px;
      padding: 5px 8px;
    }
    #inv-pos-bar.hidden { display: none !important; }
    .pos-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 900;
      color: #7ee8fa;
      text-shadow: 1px 1px 0 #000;
    }
    #pos-coords-label {
      color: #ffe666;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .pos-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pos-nudge-btn {
      min-width: 28px;
      height: 26px;
      padding: 0 7px;
      background: linear-gradient(180deg, #3c8dbc 0%, #24648c 100%);
      border: 1.5px solid #7ec8f2;
      border-radius: 3px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
    }
    .pos-nudge-btn:active { transform: scale(0.92); }
    .pos-nudge-btn.rst {
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      border-color: #fde047;
    }
    .pos-nudge-btn.done {
      background: linear-gradient(180deg, #2ea853 0%, #1c7336 100%);
      border-color: #6ee794;
    }

    .inv-preview-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .inv-preview-frame {
      width: 38px;
      height: 38px;
      background: rgba(16, 46, 72, 0.9);
      border: 2px solid #ffe666;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #inv-selected-icon {
      width: 30px;
      height: 30px;
      image-rendering: pixelated;
    }
    .inv-info-left {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }
    #inv-selected-name {
      font-size: 13px;
      font-weight: 900;
      color: #ffe666;
      text-shadow: 1px 1px 0 #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .inv-meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 800;
      color: #bde4fa;
      text-shadow: 1px 1px 0 #000;
    }
    #inv-capacity-badge {
      color: #7ee8fa;
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .inv-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .gt-inv-btn {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3px;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
      border: 2px solid #000;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
    }
    .gt-inv-btn:active { transform: translateY(1px); }
    .gt-inv-btn.equip { background: linear-gradient(180deg, #32b85c 0%, #1d7a3a 100%); border-color: #79f29e; }
    .gt-inv-btn.pos   { background: linear-gradient(180deg, #0ea5e9 0%, #0369a1 100%); border-color: #7dd3fc; }
    .gt-inv-btn.drop  { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); border-color: #fde047; }
    .gt-inv-btn.trash { background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border-color: #fca5a5; }

    #inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 4px;
      max-height: 48px;
      overflow-x: auto;
      overflow-y: hidden;
      transition: max-height 0.16s ease;
    }
    #inv-drawer[data-state="expanded"] #inv-grid {
      max-height: 196px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .inv-slot {
      position: relative;
      height: 46px;
      background: rgba(13, 38, 60, 0.88);
      border: 2px solid #4fa3d1;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.55), inset 0 -1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .inv-slot.selected {
      border-color: #ffe666;
      background: rgba(45, 118, 168, 0.78);
      box-shadow: inset 0 0 0 2px #000, 0 0 6px rgba(255, 230, 102, 0.7);
    }
    .inv-slot.equipped { border-color: #4ade80; }
    .inv-slot.equipped.selected { border-color: #ffe666; }
    .inv-slot canvas {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }
    .inv-qty {
      position: absolute;
      right: 2px;
      bottom: 1px;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      pointer-events: none;
    }
    .inv-eq-tag {
      position: absolute;
      left: 2px;
      top: 1px;
      font-size: 9px;
      font-weight: 900;
      color: #4ade80;
      text-shadow: 1px 1px 0 #000;
      pointer-events: none;
    }

    /* ─── Authentic GT Blue Dialog Modals ─── */
    .gt-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 100;
    }
    .gt-modal-overlay.hidden { display: none; }

    .gt-dialog {
      width: min(500px, 95vw);
      max-height: 88dvh;
      background: rgba(20, 56, 86, 0.96);
      border: 3px solid #7ec8f2;
      box-shadow: inset 0 0 0 2px #0b1f33, 0 10px 30px rgba(0,0,0,0.75);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .gt-dialog-header {
      background: rgba(12, 34, 54, 0.92);
      border-bottom: 2px solid #5ca8d6;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gt-dialog-title {
      font-size: 15px;
      font-weight: 900;
      color: #ffe666;
      text-shadow: 1px 1px 0 #000;
    }
    .gt-dialog-body {
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gt-section-box {
      background: rgba(10, 28, 44, 0.55);
      border: 1.5px solid rgba(126, 200, 242, 0.4);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gt-section-label {
      font-size: 11px;
      font-weight: 900;
      color: #7ec8f2;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0 #000;
    }

    .gt-btn {
      background: linear-gradient(180deg, #3c8dbc 0%, #24648c 100%);
      border: 2px solid #7ec8f2;
      border-bottom-color: #163d57;
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 12px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
    }
    .gt-btn:active { transform: translateY(1px); }
    .gt-btn.green  { background: linear-gradient(180deg, #2ea853 0%, #1c7336 100%); border-color: #6ee794; }
    .gt-btn.red    { background: linear-gradient(180deg, #d94136 0%, #99241c 100%); border-color: #f5867d; }
    .gt-btn.active { background: linear-gradient(180deg, #e0a82e 0%, #a67612 100%); border-color: #ffe666; }

    .gt-input {
      width: 100%;
      background: rgba(8, 22, 36, 0.88);
      border: 2px solid #5ca8d6;
      border-radius: 4px;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .gt-range-row { display: flex; align-items: center; gap: 10px; }
    .gt-range-row input[type="range"] { flex: 1; accent-color: #ffe666; cursor: pointer; }
    .world-list { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ─── REAL GROWTOPIA STORE WINDOW ─── */
    .gt-store-shell {
      width: min(700px, 97vw);
      height: min(460px, 92dvh);
      background: linear-gradient(180deg, #1d4e78 0%, #123352 100%);
      border: 3px solid #7ec8f2;
      box-shadow: inset 0 0 0 2px #0b1f33, 0 12px 35px rgba(0, 0, 0, 0.85);
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .gt-store-topbar {
      flex-shrink: 0;
      height: 44px;
      background-color: #10324f;
      background-image: url('tilesheets/interface/large/gui_store_top.png');
      background-size: 100% 100%;
      border-bottom: 2px solid #5ca8d6;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .gt-store-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #ffe666;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    }
    .gt-store-right-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gt-store-balance {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(6, 18, 30, 0.82);
      border: 2px solid #5ca8d6;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 900;
      color: #ffe666;
      text-shadow: 1px 1px 0 #000;
    }

    .gt-store-main {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .gt-store-sidebar {
      width: 134px;
      flex-shrink: 0;
      background: rgba(9, 27, 44, 0.78);
      border-right: 2px solid #4fa3d1;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }
    .store-tab-btn {
      width: 100%;
      text-align: left;
      padding: 8px 9px;
      background: linear-gradient(180deg, #276291 0%, #194469 100%);
      border: 2px solid #539ec9;
      border-bottom-color: #0e283f;
      border-radius: 4px;
      color: #dbeafe;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-shadow: 1px 1px 0 #000;
      cursor: pointer;
    }
    .store-tab-btn.active {
      background: linear-gradient(180deg, #f5b935 0%, #c98112 100%);
      border-color: #fff099;
      border-bottom-color: #7c4a03;
      color: #ffffff;
    }
    .store-tab-btn:active { transform: translateY(1px); }

    .gt-store-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 7px;
      overflow: hidden;
    }

    .gt-store-search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #shop-count-label {
      font-size: 11px;
      font-weight: 800;
      color: #93d5f7;
      white-space: nowrap;
      text-shadow: 1px 1px 0 #000;
    }

    .gt-store-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 3px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 7px;
      align-content: start;
    }

    .shop-card {
      background: linear-gradient(180deg, #225a87 0%, #153c5e 100%);
      border: 2px solid #63b7e6;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
      border-radius: 5px;
      padding: 6px 7px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }
    .shop-card:hover { border-color: #ffe666; }
    .shop-card:active { transform: scale(0.985); }

    .shop-card-icon-box {
      width: 42px;
      height: 42px;
      background: rgba(8, 24, 40, 0.85);
      border: 2px solid #4fa3d1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .shop-card-icon-box canvas {
      width: 34px;
      height: 34px;
      image-rendering: pixelated;
    }

    .shop-card-mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .shop-card-name {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shop-card-desc {
      font-size: 10px;
      font-weight: 700;
      color: #a5defc;
      text-shadow: 1px 1px 0 #000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-buy-pill {
      flex-shrink: 0;
      background: linear-gradient(180deg, #32b85c 0%, #1d7a3a 100%);
      border: 2px solid #79f29e;
      border-bottom-color: #104a22;
      border-radius: 4px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 900;
      color: #ffe666;
      text-shadow: 1px 1px 0 #000;
    }

    @media (max-width: 768px) {
      .gt-ctrl-btn { width: 50px; height: 50px; }
      #gt-chat-box { width: min(290px, 38vw); }
      .gt-store-sidebar { width: 108px; padding: 5px; }
      .store-tab-btn { font-size: 10px; padding: 7px 6px; }
      .shop-grid { grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); }
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="load-title">GROWTOPIA SANDBOX</div>
  <div class="load-bar-bg"><div id="load-bar-fill"></div></div>
  <div id="load-status">Loading database...</div>
</div>

<div id="game-root">
  <canvas id="game-canvas"></canvas>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-top-left">
      <div id="hud-profile-card" title="Profile &amp; World">
        <div id="hud-avatar-box">
          <canvas id="hud-avatar-mini" width="48" height="48"></canvas>
        </div>
        <div class="hud-profile-info">
          <div class="hud-name-row">
            <span id="hud-player-name">Growtopian</span>
            <span id="hud-world-tag">START</span>
          </div>
          <div class="hud-gems-row">
            <canvas id="hud-gem-icon" class="pixel-gem-canvas" width="16" height="16"></canvas>
            <span id="hud-gems-val">0</span>
            <button id="btn-gems-plus" title="Open Store">
              <img data-trim-src="tilesheets/interface/large/gui_buy_plus.png" src="tilesheets/interface/large/gui_buy_plus.png" alt="+">
            </button>
          </div>
        </div>
      </div>

      <button class="hud-icon-btn" id="btn-chat-toggle" title="Chat">
        <img data-trim-src="tilesheets/interface/large/chat_button.png" src="tilesheets/interface/large/chat_button.png" alt="Chat">
      </button>
    </div>

    <!-- Top-Right: Fullscreen, Zoom -/+ & Trimmed Store/Menu -->
    <div class="hud-top-right">
      <button class="hud-zoom-btn" id="btn-fullscreen" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.6" fill="none">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <polyline points="21 15 21 21 15 21"/>
          <polyline points="3 9 3 3 9 3"/>
        </svg>
      </button>
      <button class="hud-zoom-btn" id="btn-zoom-out" title="Zoom Out">-</button>
      <button class="hud-zoom-btn" id="btn-zoom-in" title="Zoom In">+</button>
      <button class="hud-icon-btn" id="btn-shop-open" title="Growtopia Store">
        <img data-trim-src="tilesheets/interface/large/shop_button.png" src="tilesheets/interface/large/shop_button.png" alt="Shop">
      </button>
      <button class="hud-icon-btn" id="btn-menu-open" title="Menu &amp; Settings">
        <img data-trim-src="tilesheets/interface/large/menu_button.png" src="tilesheets/interface/large/menu_button.png" alt="Menu">
      </button>
    </div>
  </div>

  <!-- Real GT 3-State Top-Center Chat Console -->
  <div id="gt-chat-box" data-state="normal">
    <div id="chat-log"></div>
    <button id="chat-handle-btn" title="Drag Up to Hide / Drag Down to Expand">
      <img id="chat-handle-img" src="tilesheets/interface/handle_down.png" alt="Chat">
    </button>
  </div>

  <!-- Chat Input -->
  <div id="chat-input-wrap" class="hidden">
    <input type="text" id="chat-input" maxlength="80" placeholder="Type message... (/respawn, /gems, /warp NAME)">
    <button class="gt-btn green" id="btn-chat-send">SEND</button>
  </div>

  <!-- Transparent Touch Controls -->
  <div id="touch-left">
    <button class="gt-ctrl-btn" id="ctrl-left" data-key="left">
      <img src="tilesheets/interface/large/left_arrow.png" alt="Left">
    </button>
    <button class="gt-ctrl-btn" id="ctrl-right" data-key="right">
      <img src="tilesheets/interface/large/right_arrow.png" alt="Right">
    </button>
  </div>

  <div id="touch-right">
    <button class="gt-ctrl-btn" id="ctrl-punch" data-key="punch">
      <img src="tilesheets/interface/large/punch_icon.png" alt="Punch">
    </button>
    <button class="gt-ctrl-btn" id="ctrl-jump" data-key="jump">
      <img src="tilesheets/interface/large/jump_icon.png" alt="Jump">
    </button>
  </div>

  <!-- Real GT 3-State Sliding Bottom Inventory Drawer -->
  <div id="inv-drawer" data-state="normal">
    <button id="inv-handle-btn" title="Drag Up to Expand / Drag Down to Hide">
      <img id="inv-handle-img" src="tilesheets/interface/handle_up.png" alt="Inventory">
    </button>
    <div id="inv-panel">
      <div id="inv-action-bar">
        <div class="inv-preview-group">
          <div class="inv-preview-frame">
            <canvas id="inv-selected-icon" width="32" height="32"></canvas>
          </div>
          <div class="inv-info-left">
            <span id="inv-selected-name">Fist</span>
            <div class="inv-meta-line">
              <span id="inv-selected-sub">Tool</span>
              <span id="inv-capacity-badge">6 / 36</span>
            </div>
          </div>
        </div>
        <div class="inv-actions">
          <button class="gt-inv-btn equip" id="btn-inv-equip" style="display:none;">EQUIP</button>
          <button class="gt-inv-btn pos" id="btn-inv-pos" style="display:none;">POS</button>
          <button class="gt-inv-btn drop" id="btn-inv-drop" style="display:none;">DROP</button>
          <button class="gt-inv-btn trash" id="btn-inv-trash" style="display:none;">TRASH</button>
        </div>
      </div>

      <!-- Inline Wearable Position Nudge Bar (AvatarPositioning) -->
      <div id="inv-pos-bar" class="hidden">
        <div class="pos-info">
          <span id="pos-item-label">ADJUST POSITION</span>
          <span id="pos-coords-label">X: 0, Y: 0</span>
        </div>
        <div class="pos-controls">
          <button class="pos-nudge-btn" id="btn-pos-left" title="Left">&lt;</button>
          <button class="pos-nudge-btn" id="btn-pos-up" title="Up">^</button>
          <button class="pos-nudge-btn" id="btn-pos-down" title="Down">v</button>
          <button class="pos-nudge-btn" id="btn-pos-right" title="Right">&gt;</button>
          <button class="pos-nudge-btn rst" id="btn-pos-reset">RST</button>
          <button class="pos-nudge-btn done" id="btn-pos-done">OK</button>
        </div>
      </div>

      <div id="inv-grid"></div>
    </div>
  </div>
</div>

<!-- World, Profile & Settings Menu Modal -->
<div id="modal-world" class="gt-modal-overlay hidden">
  <div class="gt-dialog">
    <div class="gt-dialog-header">
      <span class="gt-dialog-title">MENU &amp; SETTINGS</span>
      <button class="gt-btn red" id="close-modal-world">CLOSE</button>
    </div>
    <div class="gt-dialog-body">
      <div class="gt-section-box">
        <span class="gt-section-label">DISPLAY NAME (GROWID)</span>
        <div style="display:flex;gap:8px;">
          <input type="text" id="player-name-input" class="gt-input" maxlength="16" placeholder="Growtopian">
          <button class="gt-btn green" id="btn-save-name">SET</button>
        </div>
      </div>

      <div class="gt-section-box">
        <span class="gt-section-label">WORLD WARP</span>
        <div style="display:flex;gap:8px;">
          <input type="text" id="world-warp-input" class="gt-input" maxlength="20" placeholder="WORLD NAME">
          <button class="gt-btn green" id="btn-do-warp">ENTER</button>
        </div>
        <div id="saved-worlds-list" class="world-list"></div>
      </div>

      <div class="gt-section-box">
        <span class="gt-section-label">SCREEN &amp; HUD SIZE</span>
        <div class="gt-range-row">
          <input type="range" id="hud-scale-slider" min="70" max="130" step="5" value="100">
          <span id="hud-scale-val" style="font-size:12px;font-weight:900;color:#ffe666;min-width:40px;text-align:right;">100%</span>
          <button class="gt-btn" id="btn-hud-reset">RESET</button>
        </div>
        <button class="gt-btn green" id="btn-menu-fullscreen">TOGGLE FULLSCREEN</button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;">
        <button class="gt-btn" id="btn-menu-respawn">RESPAWN</button>
        <button class="gt-btn green" id="btn-menu-save">SAVE NOW</button>
        <button class="gt-btn red" id="btn-menu-reset-world">RESET WORLD</button>
      </div>
    </div>
  </div>
</div>

<!-- REAL GROWTOPIA STORE MODAL -->
<div id="modal-shop" class="gt-modal-overlay hidden">
  <div class="gt-store-shell">
    <div class="gt-store-topbar">
      <span class="gt-store-title">GROWTOPIA STORE</span>
      <div class="gt-store-right-head">
        <div class="gt-store-balance">
          <canvas id="store-gem-icon" class="pixel-gem-canvas" width="16" height="16"></canvas>
          <span id="store-gems-val">0</span>
        </div>
        <button class="gt-btn red" id="close-modal-shop">BACK</button>
      </div>
    </div>

    <div class="gt-store-main">
      <div class="gt-store-sidebar" id="shop-tabs">
        <button class="store-tab-btn active" data-tab="special">PRO &amp; SPECIAL</button>
        <button class="store-tab-btn" data-tab="starter">LOCKS &amp; STARTER</button>
        <button class="store-tab-btn" data-tab="wings">WINGS &amp; BACK</button>
        <button class="store-tab-btn" data-tab="wearables">CLOTHING</button>
        <button class="store-tab-btn" data-tab="blocks">BLOCKS &amp; SEEDS</button>
        <button class="store-tab-btn" data-tab="all">ALL 16K ITEMS</button>
      </div>

      <div class="gt-store-content">
        <div class="gt-store-search-row">
          <input type="text" id="shop-search" class="gt-input" placeholder="Search Rayman, Pickaxe, Magplant, Wings...">
          <span id="shop-count-label">0 items</span>
        </div>
        <div class="gt-store-scroll">
          <div id="shop-grid" class="shop-grid"></div>
          <button class="gt-btn" id="btn-shop-more" style="align-self:center;display:none;">LOAD MORE ITEMS</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Drop Amount Modal -->
<div id="modal-drop" class="gt-modal-overlay hidden">
  <div class="gt-dialog" style="width:min(340px, 90vw);">
    <div class="gt-dialog-header">
      <span class="gt-dialog-title" id="drop-modal-title">DROP ITEM</span>
      <button class="gt-btn red" id="close-modal-drop">X</button>
    </div>
    <div class="gt-dialog-body">
      <div style="font-size:12px;color:#cbe7f7;">How many to drop?</div>
      <input type="number" id="drop-qty-input" class="gt-input" min="1" max="200" value="1">
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="gt-btn" id="btn-drop-all">ALL</button>
        <button class="gt-btn green" id="btn-drop-confirm">DROP</button>
      </div>
    </div>
  </div>
</div>

<!-- Existing Repo Modules -->
<script src="world_catalog.js"></script>
<script src="autotile.js"></script>
<script src="wearable_catalog.js"></script>
<script src="wearable_sequence.js"></script>
<script src="avatar_positioning.js"></script>

<!-- Game Engine Modules -->
<script src="gt_core.js"></script>
<script src="gt_player.js"></script>
<script src="gt_gameplay.js"></script>
</body>
</html>
